<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVP - Catálogo de Produtos e Carrinho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        header {
            background-color: #1e293b;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
        }

        .product-image {
            width: 100%;
            height: 150px;
            background-color: #e2e8f0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin-bottom: 15px;
        }

        .product-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #1e293b;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #059669;
            margin-bottom: 15px;
        }

        .btn-add {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background-color: #1d4ed8;
        }

        .cart {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            height: fit-content;
        }

        .cart-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
            color: #1e293b;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #e2e8f0;
        }

        .cart-item-info {
            flex-grow: 1;
        }

        .btn-remove {
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .cart-total {
            margin-top: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            text-align: right;
            color: #1e293b;
        }

        .btn-checkout {
            width: 100%;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .btn-checkout:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <header>
        <h1>TechStore MVP</h1>
        <p>Seu catálogo virtual de tecnologia de forma simples e rápida</p>
    </header>

    <div class="container">
        <!-- Seção do Catálogo -->
        <main class="catalog" id="catalog-container">
            <!-- Os produtos serão injetados via JavaScript -->
        </main>

        <!-- Seção do Carrinho -->
        <aside class="cart">
            <h2 class="cart-title">🛒 Seu Carrinho</h2>
            <div id="cart-items">
                <!-- Itens adicionados aparecem aqui -->
                <p style="color: #64748b; text-align: center;">O carrinho está vazio.</p>
            </div>
            <div class="cart-total" id="cart-total">Total: R\$ 0,00</div>
            <button class="btn-checkout" onclick="checkout()">Finalizar Simulação</button>
        </aside>
    </div>

    <script>
        // Banco de dados simulado (Mock) dos produtos do MVP
        const products = [
            { id: 1, name: "Smartphone Alpha", price: 1899.00, icon: "📱" },
            { id: 2, name: "Notebook Pro 14", price: 4200.00, icon: "💻" },
            { id: 3, name: "Fone Bluetooth Max", price: 299.90, icon: "🎧" },
            { id: 4, name: "Smartwatch Sport", price: 450.00, icon: "⌚" },
            { id: 5, name: "Teclado Mecânico RGB", price: 350.00, icon: "⌨️" },
            { id: 6, name: "Mouse Gamer Sem Fio", price: 199.00, icon: "🖱️" }
        ];

        // Estado do carrinho em memória
        let cart = [];

        // Renderiza os produtos na tela
        function displayProducts() {
            const catalogContainer = document.getElementById('catalog-container');
            catalogContainer.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-image">${product.icon}</div>
                    <h3 class="product-title">${product.name}</h3>
                    <div class="product-price">R$ ${product.price.toFixed(2).replace('.', ',')}</div>
                    <button class="btn-add" onclick="addToCart(${product.id})">Adicionar</button>
                </div>
            `).join('');
        }

        // Adiciona um produto ao carrinho
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);

            if (cartItem) {
                cartItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCart();
        }

        // Remove ou diminui a quantidade de um item
        function removeFromCart(productId) {
            const cartItemIndex = cart.findIndex(item => item.id === productId);
            if (cartItemIndex > -1) {
                cart[cartItemIndex].quantity -= 1;
                if (cart[cartItemIndex].quantity === 0) {
                    cart.splice(cartItemIndex, 1);
                }
            }
            updateCart();
        }

        // Atualiza a interface do carrinho e recalcula totais
        function updateCart() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartTotalContainer = document.getElementById('cart-total');

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: #64748b; text-align: center;">O carrinho está vazio.</p>';
                cartTotalContainer.innerText = 'Total: R\$ 0,00';
                return;
            }

            let total = 0;
            cartItemsContainer.innerHTML = cart.map(item => {
                const subtotal = item.price * item.quantity;
                total += subtotal;
                return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div><strong>${item.name}</strong></div>
                            <div style="font-size: 0.9rem; color: #64748b;">
                                ${item.quantity}x R$ ${item.price.toFixed(2).replace('.', ',')}
                            </div>
                        </div>
                        <button class="btn-remove" onclick="removeFromCart(${item.id})">Remover</button>
                    </div>
                `;
            }).join('');

            cartTotalContainer.innerText = `Total: R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        // Evento do botão de checkout
        function checkout() {
            if (cart.length === 0) {
                alert("Seu carrinho está vazio! Adicione produtos antes de finalizar.");
                return;
            }
            alert("MVP Validado com Sucesso!\nSimulação de compra concluída. Os dados foram enviados para o fluxo fictício de venda.");
            cart = [];
            updateCart();
        }

        // Inicializa o catálogo ao carregar a página
        displayProducts();
    </script>
</body>
</html>
